<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketFeed - Stock RSS Creator & Filter Engine</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0f172a">
</head>
<body>
  <header class="app-header">
    <div class="logo-container">
      <span class="logo-icon">📈</span>
      <h1>MarketFeed</h1>
    </div>
    <div class="header-actions">
      <button id="refresh-now-btn" class="btn btn-secondary">🔄 Refresh News</button>
      <button id="add-bundle-btn" class="btn btn-secondary">+ New Bundle</button>
      <button id="add-feed-btn" class="btn btn-primary">⚡ Create Feed</button>
    </div>
  </header>

  <main class="app-container">
    <nav class="rss-tab-nav">
      <div class="tab-group">
        <button class="tab-btn active" data-tab="news">📰 News Stream</button>
        <button class="tab-btn" data-tab="feeds">📡 Manage Feeds</button>
        <button class="tab-btn" data-tab="bundles">📦 Manage Bundles</button>
        <button class="tab-btn" data-tab="filters">🔍 RSS.app Filters</button>
      </div>
    </nav>

    <section class="filter-bar">
      <div class="search-box">
        <input type="text" id="feed-search" placeholder="Search ticker, company, or keyword (e.g. $RELIANCE)...">
      </div>
      <div class="filter-pills" id="bundle-pills-container"></div>
      <div class="sort-box">
        <select id="sort-select" class="select-input">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
        </select>
      </div>
    </section>

    <div class="content-grid">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
          <h3>My Feeds</h3>
          <ul id="feed-list" class="sidebar-list"></ul>
        </div>
        <div class="sidebar-section">
          <h3>My Bundles</h3>
          <ul id="bundle-list" class="sidebar-list"></ul>
        </div>
      </aside>

      <section class="feed-stream" id="main-view-container">
        <div id="stream-header" class="stream-header">
          <h2 id="stream-title">All Market Updates</h2>
          <span id="unread-count" class="counter">0 items</span>
        </div>
        <div id="feed-items-container" class="feed-cards-grid"></div>
      </section>
    </div>
  </main>

  <!-- Create Feed Modal -->
  <div id="feed-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h3>⚡ Create Stock RSS Feed</h3>
      <form id="feed-form">
        <div class="form-group">
          <label>Feed Name / Ticker</label>
          <input type="text" id="feed-name-input" placeholder="e.g. Reliance Industries or $TATA" required>
        </div>
        <div class="form-group">
          <label>Feed Source Type</label>
          <select id="feed-type-select" class="select-input full-width">
            <option value="keyword">Keyword Search (Auto-Generates Google News RSS)</option>
            <option value="rss">Custom RSS / XML URL</option>
          </select>
        </div>
        <div class="form-group">
          <label>Keyword Query or RSS URL</label>
          <input type="text" id="feed-url-input" placeholder="e.g. RELIANCE stock OR https://..." required>
        </div>
        <div class="form-group">
          <label>Assign to Bundle (Optional)</label>
          <select id="feed-bundle-select" class="select-input full-width">
            <option value="Unassigned">Unassigned</option>
          </select>
        </div>
        <div class="form-group checkbox-group">
          <label><input type="checkbox" id="feed-alert-toggle" checked> Send Mobile & Sound Alerts for this Feed</label>
        </div>
        <button type="submit" class="btn btn-primary full-width">Create & Fetch Articles</button>
      </form>
    </div>
  </div>

  <!-- Create Bundle Modal -->
  <div id="bundle-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h3>📦 Create Feed Bundle</h3>
      <form id="bundle-form">
        <div class="form-group">
          <label>Bundle Name</label>
          <input type="text" id="bundle-name-input" placeholder="e.g. Banking Stocks, Sector Focus" required>
        </div>
        <div class="form-group checkbox-group">
          <label><input type="checkbox" id="bundle-alert-toggle" checked> Send Mobile & Sound Alerts for this Bundle</label>
        </div>
        <button type="submit" class="btn btn-primary full-width">Save Bundle</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
