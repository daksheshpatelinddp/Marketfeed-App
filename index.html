<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketFeed - Stock RSS Creator & Reader</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0f172a">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="logo-container">
      <span class="logo-icon">📈</span>
      <h1>MarketFeed</h1>
    </div>
    <div class="header-actions">
      <button id="notification-btn" class="btn btn-icon" title="Notification Settings">
        🔔 <span id="notif-badge" class="badge hidden"></span>
      </button>
      <button id="refresh-now-btn" class="btn btn-secondary">🔄 Refresh</button>
      <button id="add-feed-btn" class="btn btn-primary">+ New Feed</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-container">
    
    <!-- Top Bar: rss.app Style Navigation & Filter Tabs -->
    <nav class="rss-tab-nav">
      <div class="tab-group">
        <button class="tab-btn active" data-tab="all">All Feeds</button>
        <button class="tab-btn" data-tab="bundles">📦 Bundles</button>
        <button class="tab-btn" data-tab="filters">🔍 Saved Filters</button>
      </div>

      <!-- Controls & Auto-Refresh Options -->
      <div class="tab-controls">
        <label for="auto-refresh-select" class="control-label">Auto-Refresh:</label>
        <select id="auto-refresh-select" class="select-input">
          <option value="0">Off</option>
          <option value="1" selected>Every 1 Min</option>
          <option value="5">Every 5 Mins</option>
          <option value="15">Every 15 Mins</option>
        </select>
      </div>
    </nav>

    <!-- Sub-Filter Bar (Search, Tickers, Sorting) -->
    <section class="filter-bar">
      <div class="search-box">
        <input type="text" id="feed-search" placeholder="Search ticker, company, or keyword (e.g. $RELIANCE)...">
      </div>
      
      <div class="filter-pills" id="bundle-pills-container">
        <button class="pill-btn active" data-filter="all">All</button>
        <!-- Dynamic Bundle and Ticker Pills will render here -->
      </div>

      <div class="sort-box">
        <select id="sort-select" class="select-input">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
        </select>
      </div>
    </section>

    <!-- Content Layout -->
    <div class="content-grid">
      
      <!-- Sidebar Navigation for Feeds/Bundles -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
          <h3>My Feeds</h3>
          <ul id="feed-list" class="sidebar-list"></ul>
        </div>
        
        <div class="sidebar-section">
          <h3>My Bundles</h3>
          <ul id="bundle-list" class="sidebar-list"></ul>
        </div>
      </aside>

      <!-- Main Feed Items Stream -->
      <section class="feed-stream">
        <div id="stream-header" class="stream-header">
          <h2 id="stream-title">All Updates</h2>
          <span id="unread-count" class="counter">0 items</span>
        </div>

        <div id="feed-items-container" class="feed-cards-grid">
          <!-- Feed cards dynamically injected here -->
        </div>
      </section>

    </div>
  </main>

  <!-- Modal: Add/Edit Feed & Bundle Alerts -->
  <div id="feed-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h3 id="modal-title">Add Stock RSS Feed</h3>
      <form id="feed-form">
        <div class="form-group">
          <label>Feed Name / Ticker</label>
          <input type="text" id="feed-name-input" placeholder="e.g. Nifty 50 News" required>
        </div>
        <div class="form-group">
          <label>URL / Source Query</label>
          <input type="url" id="feed-url-input" placeholder="https://..." required>
        </div>
        <div class="form-group">
          <label>Assign to Bundle</label>
          <input type="text" id="feed-bundle-input" placeholder="e.g. Banking, Stocks, Crypto">
        </div>
        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="feed-alert-toggle" checked>
            Send Mobile Alert on New Posts
          </label>
        </div>
        <button type="submit" class="btn btn-primary full-width">Save Feed</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
