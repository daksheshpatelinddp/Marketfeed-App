<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MarketFeed - RSS Generator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111827">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="logo-title">MarketFeed</div>
  </header>

  <!-- Generator Search Box -->
  <section class="search-section">
    <div class="search-box">
      <input type="text" id="feed-input" placeholder="Enter Topic or Keyword (e.g. Kfintech, Infosys)..." autocomplete="off" />
      <button id="btn-generate" onclick="handleGenerateClick()">Generate</button>
    </div>
  </section>

  <!-- Main Content Container -->
  <main id="app-content" class="content-container">
    <!-- Dynamic Content Loaded by app.js -->
  </main>

  <!-- Loading Overlay -->
  <div id="loading-spinner" class="spinner-overlay hidden">
    <div class="spinner"></div>
    <p>Generating RSS Feed...</p>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-my-feeds" onclick="switchTab('my-feeds')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg>
      <span>My Feeds</span>
    </button>
    <button class="nav-btn" id="nav-create" onclick="switchTab('create')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <span>New Feed</span>
    </button>
  </nav>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
