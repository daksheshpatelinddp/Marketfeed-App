<dialog id="feedDialog">
  <form method="dialog" id="feedForm">
    <h2>Add or Generate RSS Feed</h2>
    <label>Feed Name / Stock Ticker
      <input id="feedName" required placeholder="e.g. KPIT, Moneycontrol, VBL">
    </label>
    
    <label>Feed URL (Auto-generated or custom RSS link)
      <input id="feedUrl" type="url" required placeholder="https://example.com/feed.xml">
    </label>
    
    <div style="margin: 10px 0;">
      <button type="button" class="button" id="autoGenBtn">⚡ Auto-Generate Feed Link</button>
    </div>

    <label>Bundle<select id="feedBundle"></select></label>
    
    <div class="actions">
      <button value="cancel">Cancel</button>
      <button class="primary" value="default">Save Feed</button>
    </div>
  </form>
</dialog>
